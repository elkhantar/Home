plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Own app id; the Java namespace stays com.gathin.tvhome so upstream CleanYourTV changes merge cleanly.
        applicationId 'com.privs.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '1.11-spanish-menus'
        testInstrumentationRunner 'com.gathin.tvhome.BannerLoadingTest'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('../local/personal.jks')
            storePassword 'android'
            keyAlias 'cosy'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            // Resource ZipFS canonicalization is restricted in the local Windows build session.
            // Normal builds still shrink resources; the personal build retains them and keeps R8 on.
            shrinkResources !project.hasProperty('personalSandboxBuild')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    // Kotlin metadata pulled in by AndroidX; the launcher is Java and never reads it.
    packaging {
        resources {
            excludes += ['kotlin/**', 'META-INF/*.kotlin_module', 'META-INF/*.version', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Upstream locales are partial; Android falls back to English. Keep findings visible.
        warning 'MissingTranslation'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
